[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talentfit-mvp"
version = "0.1.0"
description = "TalentFit MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "chromadb",
    "ollama",
    "openpyxl",
    "pandas",
    "pydantic",
    "PyMuPDF",
    "python-dotenv",
    "streamlit",
    "xlrd",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
